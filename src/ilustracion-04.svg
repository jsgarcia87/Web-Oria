<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .outline { fill:#000000; }
      .orange { fill:#F07F29; }
      .olive { fill:#194D06; }
      .stroke { fill:none; stroke:#000000; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <!-- stairs, drawn behind the figure -->
  <polyline class="stroke" points="10,540 90,540 90,480 170,480 170,420 250,420 250,360 290,360" />

  <!-- back leg (olive trouser), bent as if stepping up -->
  <path class="olive" d="M138,328 C129,358 124,398 128,438 C130,457 137,470 148,478 L172,478 C167,454 163,428 166,402 C169,377 175,350 178,328 Z" />

  <!-- front leg (olive trouser) planted on upper step -->
  <path class="olive" d="M174,328 C182,350 191,370 198,390 C204,408 208,398 210,406 L228,400 C222,373 213,347 202,325 Z" />

  <!-- shoes -->
  <path class="outline" d="M126,470 L152,470 C159,470 169,474 169,480 C169,487 160,489 149,489 L118,489 C114,489 112,485 114,481 Z" />
  <path class="outline" d="M200,390 L228,394 C236,396 245,402 243,409 C241,415 230,415 220,411 L193,404 C191,398 196,392 200,390 Z" />

  <!-- torso, orange top -->
  <path class="orange" d="M130,208 C118,219 110,237 110,258 L110,300 C110,318 119,330 137,334 L188,332 C202,328 210,314 208,296 L204,248 C202,226 189,210 171,204 Z" />

  <!-- lowered arm -->
  <path class="orange" d="M132,224 C120,231 111,244 108,259 C106,268 107,278 111,286 L125,282 C123,271 125,259 131,249 C135,242 141,236 147,231 Z" />

  <!-- raised arm bent, gripping the pencil close to the shoulder -->
  <path class="orange" d="M170,212 C184,208 196,200 205,188 L191,172 C183,182 174,190 164,196 Z" />

  <!-- hand gripping pencil -->
  <path class="outline" d="M198,178 C204,170 213,167 221,171 C229,175 231,185 225,192 C219,199 209,201 202,196 C197,192 195,184 198,178 Z" />

  <!-- pencil: long rounded band resting on the shoulder, pointing up-forward -->
  <path class="outline" d="M182,220 L275,72 C279,66 288,64 294,68 C300,73 301,81 296,87 L211,213 C205,219 195,222 187,224 Z" />
  <path d="M275,72 L294,68 C300,73 301,81 296,87 L281,88 Z" fill="#194D06" />
  <path d="M281,88 L296,87 L290,96 Z" fill="#000000" />
  <!-- pencil body stripe to read as a rod, not a solid wedge -->
  <path d="M195,209 L280,78" stroke="#fff5e5" stroke-width="3" fill="none" opacity="0.5" />

  <!-- neck -->
  <path class="outline" d="M154,196 L174,196 L174,214 C168,218 160,218 154,214 Z" />

  <!-- head + hair, simple silhouette -->
  <ellipse class="outline" cx="167" cy="172" rx="24" ry="26" />
  <path class="outline" d="M143,163 C143,146 154,132 171,130 C188,128 202,140 204,157 C205,166 202,174 196,179 C198,169 196,159 189,152 C181,144 168,142 158,147 C150,151 146,157 145,164 Z" />

</svg>
